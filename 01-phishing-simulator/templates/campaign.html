<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GraySentinel | New Simulation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="nav-content">

        <div class="logo">

            <div class="logo-icon">
                🛡
            </div>

            <div class="logo-text">
                <h2>GRAY SENTINEL</h2>
                <span>CYBER DEFENCE LAB</span>
            </div>

        </div>

        <div class="nav-status">
            <span class="status-dot"></span>
            LOCAL LAB ONLINE
        </div>

    </div>

</nav>


<main class="container">

    <div class="form-card">

        <div class="eyebrow">
            CAMPAIGN CONFIGURATION
        </div>

        <h1>Create New Simulation</h1>

        <p class="form-description">
            Configure a controlled phishing-awareness scenario.
            This environment uses mock recipient information and
            does not send real emails.
        </p>


        <form method="POST">

            <div class="form-group">

                <label>Campaign Name</label>

                <input
                    type="text"
                    name="campaign_name"
                    placeholder="Security Awareness Test"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email Subject</label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Important Security Verification"
                    required
                >

            </div>


            <div class="form-group">

                <label>Mock Recipient Name</label>

                <input
                    type="text"
                    name="recipient_name"
                    placeholder="Test User"
                    required
                >

            </div>


            <div class="form-group">

                <label>Mock Recipient Email</label>

                <input
                    type="email"
                    name="recipient_email"
                    placeholder="test@example.com"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Simulation
                </button>

                <a href="/" class="btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>


<footer class="footer">

    CONTROLLED SECURITY TRAINING ENVIRONMENT

</footer>

</body>

</html>
